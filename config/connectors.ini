# Source adapters are disabled until an approved source is configured.
# Paths, source columns and mapping files are customer-specific inputs.
[connector:hes]
enabled = false
mode = file
format = jsonl
batch_size = 1000
source_system = hes_customer
source_shard = default

[connector:mdms]
enabled = false
mode = file
format = jsonl
batch_size = 1000
source_system = mdms_customer
source_shard = default

[connector:gis]
enabled = false
mode = file
format = jsonl
batch_size = 1000
source_system = gis_customer
source_shard = default

[connector:network]
enabled = false
mode = file
format = jsonl
batch_size = 1000
source_system = network_customer
source_shard = default

[connector:meter_events]
enabled = false
mode = file
format = jsonl
batch_size = 1000
source_system = meter_events_customer
source_shard = default

[notifications]
enabled = false
smtp_port = 587

[rabbitmq_queues]
notification_send = q.notification.send
report_generate = q.report.generate
incident_enrich = q.incident.enrich
model_train = q.model.train
model_evaluate = q.model.evaluate
integration_retry = q.integration.retry
export_generate = q.export.generate
audit_anchor = q.audit.anchor
