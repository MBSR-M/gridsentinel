[application]
name = GridSentinel Enterprise
tenant_id = demo
timezone = UTC
debug = false

[api]
host = 127.0.0.1
port = 8080
max_body_bytes = 1048576
max_connections = 64
request_timeout_seconds = 10
trusted_proxy = false

[incident]
correlation_window_minutes = 15
minimum_cluster_meter_count = 10
shared_gateway_failure_ratio = 0.70
auto_close_enabled = false

[retention]
raw_logs_days = 7
communication_events_days = 30
meter_hourly_health_days = 90
daily_health_months = 24
incident_months = 36
audit_months = 36
