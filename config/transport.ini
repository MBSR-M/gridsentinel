[api]
allowed_origins = http://localhost:8080,http://127.0.0.1:8080

[ingestion]
max_payload_bytes = 65536
max_clock_skew_seconds = 300
allowed_lateness_seconds = 900
health_replay_events = 2048

[health]
offline_after_failures = 3
expected_communication_minutes = 60
cadence_grace_multiplier = 3
recovery_successes = 2

[scheduler]
interval_seconds = 30
batch_size = 500

[kafka_topics]
raw_hes = ami.raw.hes
raw_mdms = ami.raw.mdms
raw_network = ami.raw.network
raw_meter_events = ami.raw.meter_events
raw_gis_updates = ami.raw.gis_updates
communication = ami.normalized.communication
intervals = ami.normalized.intervals
network = ami.normalized.network
topology = ami.normalized.topology
meter_health = ami.derived.meter_health
gateway_health = ami.derived.gateway_health
incident_candidates = ami.derived.incident_candidates
incidents_created = ami.incidents.created
incidents_updated = ami.incidents.updated
incidents_resolved = ami.incidents.resolved
features = ami.ml.features
predictions = ami.ml.predictions
invalid = ami.errors.invalid
processing = ami.errors.processing

[redis]
default_ttl_seconds = 300

[logging]
spool_directory = ../.local/log-spool
spool_max_files_per_instance = 2048
batch_size = 100
