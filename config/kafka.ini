[kafka]
bootstrap_servers = kafka:9092
security_protocol = PLAINTEXT
ssl_ca =
consumer_group = gridsentinel-normalizer
auto_offset_reset = earliest
enable_auto_commit = false
max_poll_records = 100
request_timeout_ms = 30000
partitions = 12
replication_factor = 1
max_payload_bytes = 262144
allowed_lateness_seconds = 3600
raw_hes_topic = ami.raw.hes
raw_mdms_topic = ami.raw.mdms
raw_network_topic = ami.raw.network
raw_meter_events_topic = ami.raw.meter_events
raw_gis_topic = ami.raw.gis_updates
normalized_communication_topic = ami.normalized.communication
normalized_intervals_topic = ami.normalized.intervals
normalized_network_topic = ami.normalized.network
normalized_topology_topic = ami.normalized.topology
invalid_topic = ami.errors.invalid
processing_errors_topic = ami.errors.processing
