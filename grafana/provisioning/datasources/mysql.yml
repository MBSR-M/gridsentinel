apiVersion: 1
prune: true
datasources:
  - name: GridSentinel Reporting
    uid: gs-reporting
    type: mysql
    access: proxy
    url: mysql:3306
    user: gs_reporter
    isDefault: true
    editable: false
    jsonData:
      database: gridsentinel
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
      tlsSkipVerify: false
    secureJsonData:
      password: $__file{/run/secrets/grafana_mysql_password}
