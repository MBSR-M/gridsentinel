[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsentinel"
version = "0.1.0"
description = "Auditable AMI incident intelligence for customer-isolated deployments"
requires-python = ">=3.12"
dependencies = [
  "PyMySQL==1.1.2",
  "kafka-python==2.2.15",
  "pika==1.3.2",
  "redis==6.4.0",
]

[project.scripts]
gridsentinel = "gridsentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
