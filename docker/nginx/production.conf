limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 8080;
    return 308 https://$host:8443$request_uri;
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Request rate limit exceeded","retryable":true},"meta":{"correlation_id":"$request_id"}}';
    }
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/gs-proxy.conf;
    }
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/gs-proxy.conf;
    }
    location / { proxy_pass http://web-ui:8080; }
}
