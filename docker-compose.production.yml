# Production preflight also requires verified TLS for database and brokers.
# Supply reviewed customer infrastructure before enabling this override.
x-production-environment: &production-environment
  GS_ENVIRONMENT: production
  GS_APPLICATION_ENVIRONMENT: production
  GS_RABBITMQ_PORT: 5671
services:
  reverse-proxy:
    ports: !override ["127.0.0.1:${GS_HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${GS_TLS_DIRECTORY:?Set GS_TLS_DIRECTORY to the certificate directory}:/run/tls:ro
  api:
    environment: *production-environment
  migrate:
    environment: *production-environment
  background-worker:
    environment: *production-environment
  scheduler:
    environment: *production-environment
  event-normalizer:
    environment: *production-environment
  hes-connector:
    environment: *production-environment
  mdms-connector:
    environment: *production-environment
  network-connector:
    environment: *production-environment
  meter-health-worker:
    environment: *production-environment
  incident-engine:
    environment: *production-environment
  ml-trainer:
    environment: *production-environment
  ml-inference:
    environment: *production-environment
  log-collector:
    environment: *production-environment
